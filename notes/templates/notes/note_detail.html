{% extends "notes/base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <p><a href="{% url 'notes:note_list' %}">← Back to notes</a></p>
    <h1>{{ note.title }}</h1>
    <p class="muted">Created {{ note.created_at|date:"M j, Y, g:i a" }}</p>
    <p>{{ note.content|linebreaksbr }}</p>

    <div class="actions">
        <a class="button secondary" href="{% url 'notes:note_update' note.pk %}">Edit note</a>
        <a class="button danger" href="{% url 'notes:note_delete' note.pk %}">Delete note</a>
    </div>
{% endblock %}
