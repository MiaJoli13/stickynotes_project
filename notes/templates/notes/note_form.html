{% extends "notes/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
    <p><a href="{% url 'notes:note_list' %}">← Back to notes</a></p>
    <h1>{{ page_title }}</h1>

    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="button primary" type="submit">Save note</button>
            {% if note %}
                <a class="button secondary" href="{% url 'notes:note_detail' note.pk %}">Cancel</a>
            {% else %}
                <a class="button secondary" href="{% url 'notes:note_list' %}">Cancel</a>
            {% endif %}
        </div>
    </form>
{% endblock %}
